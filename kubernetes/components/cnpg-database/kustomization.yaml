# yaml-language-server: $schema=https://json.schemastore.org/kustomization
---
# Declarative CNPG database + role for a tenant on a shared cluster (CNPG >= 1.30).
#
# Provisions:
#   - login role ${DB_NAME}
#   - database ${DB_NAME} owned by that role
#   - basic-auth Secret ${DB_NAME}-db-role (username/password for the role)
#
# Include from a Flux Kustomization that targetNamespace: database (Cluster,
# Database, DatabaseRole, and password Secret must be co-located).
#
# Substitutions:
#   DB_NAME              role + database name (required)
#   OP_USER              1Password property for the role username (required)
#   OP_PASS              1Password property for the role password (required)
#   CNPG_CLUSTER         target cluster (default: redspot)
#   CNPG_RECLAIM         retain|delete when resources are deleted (default: retain)
#
# The 1Password item named ${DB_NAME} must expose properties ${OP_USER} and
# ${OP_PASS}. The username value must match ${DB_NAME} (CNPG role name).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - database.yaml
  - role.yaml
  - externalsecret.yaml
