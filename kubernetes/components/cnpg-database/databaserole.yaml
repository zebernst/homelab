---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: "${APP}"
spec:
  cluster:
    name: "${CNPG_CLUSTER:=redspot}"
  name: "${APP}"
  comment: "${APP} application role"
  login: true
  # DatabaseRole has no `ensure`; removal is governed by the reclaim policy
  databaseRoleReclaimPolicy: "${CNPG_RECLAIM:=retain}"
  passwordSecret:
    name: "${APP}-db-role"
