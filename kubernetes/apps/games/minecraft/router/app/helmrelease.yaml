# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mc-router
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  values:
    serviceAccount:
      mc-router:
        enabled: true
    rbac:
      roles:
        mc-router:
          type: ClusterRole
          rules:
            - apiGroups: [ "" ]
              resources: [ "services" ]
              verbs: [ "watch", "list" ]
            - apiGroups: [ "apps" ]
              resources: [ "statefulsets", "statefulsets/scale" ]
              verbs: [ "watch", "list", "get", "update", "patch" ]
      bindings:
        mc-router:
          type: ClusterRoleBinding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            identifier: *app
          subjects:
            - identifier: *app
    defaultPodOptions:
      priorityClassName: best-effort
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      mc-router:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          mc-router:
            image:
              repository: ghcr.io/itzg/mc-router
              tag: 1.45.1@sha256:c0ba7037de0d2d91e093da1cbe528bb1ec0806abd4de8442d44092f4f39fe94e
            env:
              TZ: America/Chicago
              IN_KUBE_CLUSTER: "true"
              API_BINDING: ":8080"
              PORT: &port 25565
              CONNECTION_RATE_LIMIT: 10
              METRICS_BACKEND: prometheus
              SIMPLIFY_SRV: true
              USE_PROXY_PROTOCOL: false
              RECORD_LOGINS: true
              AUTO_SCALE_UP: "true"
              AUTO_SCALE_DOWN: "true"
              # Idle long enough that a brief disconnect doesn't tear the server down
              AUTO_SCALE_DOWN_AFTER: "2h"
              AUTO_SCALE_ASLEEP_MOTD: "§eServer is sleeping.§r Join once to wake it, then reconnect in a few minutes."
              AUTO_SCALE_LOADING_MOTD: "§eServer is starting…§r Modpack boot takes a few minutes — reconnect shortly."
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 350m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 96Mi
        serviceAccount:
          identifier: *app
    service:
      mc-router:
        controller: *app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.20.65
          # Single Minecraft health signal — backends scale to zero and shouldn't be probed
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |
            name: minecraft
            group: games
            url: http://mc-router.games.svc.cluster.local:8080/routes
            interval: 1m
            conditions:
              - "[STATUS] == 200"
            ui:
              hide-url: true
              hide-hostname: true
              hide-port: true
        ports:
          java:
            port: *port
          api:
            port: 8080
    serviceMonitor:
      mc-router:
        serviceName: *app
        endpoints:
          - port: api
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 30s
    route:
      api:
        kind: HTTPRoute
        annotations:
          # Health is on the Service above; don't also probe via the HTTPRoute
          gatus.home-operations.com/enabled: "false"
        hostnames: ["mc-api.zebernst.dev"]
        parentRefs:
          - name: lan
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: 8080
