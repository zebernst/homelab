---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: mc-router
spec:
  endpoints:
    - dnsName: "minecraft.zebernst.dev"
      recordType: CNAME
      targets: ["ipv4.zebernst.dev"]
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
