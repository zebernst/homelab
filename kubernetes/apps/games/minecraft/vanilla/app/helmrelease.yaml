# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vanilla
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  values:
    controllers:
      vanilla:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-bluemap-config:
            image:
              repository: busybox
              tag: latest
            command: ["sh", "-c"]
            args:
              - |
                cp /configs-source/*.conf /app/config/
                mkdir -p /app/config/maps
                cp /maps-source/*.conf /app/config/maps/
        containers:
          vanilla:
            image:
              repository: ghcr.io/itzg/minecraft-server
              tag: 2026.8.0
            env:
              EULA: "true"
              TZ: America/Chicago
              TYPE: "VANILLA"
              VERSION: "LATEST"
              ICON: https://media.forgecdn.net/avatars/thumbnails/1382/76/64/64/638896474054932351.png
              MOTD: |
                A Minecraft server on %VERSION%.
                §oHosted on §dJupiter§r
              SERVER_NAME: *app
              DIFFICULTY: normal
              ALLOW_FLIGHT: true
              ENFORCE_WHITELIST: "true"
              EXISTING_WHITELIST_FILE: SYNCHRONIZE
              WHITELIST: |
                zebernst
                Snorlocke
                Travler34__
              OPS: |
                zebernst
              PAUSE_WHEN_EMPTY_SECONDS: "60"
              INIT_MEMORY: 1G
              MAX_MEMORY: &max-memory 4G
              RCON_PORT: "25578"
            envFrom:
              - secretRef:
                  name: vanilla-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  periodSeconds: 15
                  exec: &probeexec { command: [ "mc-health" ] }
              readiness: *probe
              startup:
                <<: *probe
                spec:
                  initialDelaySeconds: 10
                  periodSeconds: 1
                  failureThreshold: 60
                  exec: *probeexec
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 1
                memory: *max-memory
          mc-monitor:
            image:
              repository: itzg/mc-monitor
              tag: 0.17.0@sha256:0d6b89c29d93cfcfcfee7bfd8e3758ddf00e20eb157e3e9a6560a93fe7fe84d1
            args: ["export-for-prometheus"]
            env:
              EXPORT_SERVERS: vanilla
              DEBUG: "false"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
          bluemap:
            image:
              repository: ghcr.io/bluemap-minecraft/bluemap
              tag: v5.23
            args: ["-r", "-u", "-w"]
            env:
              JAVA_TOOL_OPTIONS: "-Xmx1G"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1536Mi

      rcon-web:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          rcon-web:
            image:
              repository: docker.io/itzg/rcon
              tag: latest@sha256:66cc978f196e2fb4c0afccc7bf7102773445cff85ea41eefe58dca19ea78413c
            env:
              RWA_USERNAME: admin
              RWA_ADMIN: "TRUE"
              RWA_GAME: minecraft
              RWA_SERVER_NAME: *app
              RWA_RCON_HOST: "{{ .Release.Name }}"
              RWA_RCON_PORT: "25578"
              RWA_WEBSOCKET_URL_SSL: "wss://{{ .Release.Name }}.jptr.zebernst.dev/ws"
              RWA_WEBSOCKET_URL: "wss://{{ .Release.Name }}.jptr.zebernst.dev/ws"
            envFrom:
              - secretRef:
                  name: vanilla-secret
            probes:
              liveness: &rconProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 4326
              readiness: *rconProbe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

    defaultPodOptions:
      priorityClassName: best-effort
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch

    service:
      vanilla:
        annotations:
          mc-router.itzg.me/externalServerName: "minecraft.zebernst.dev,vanilla.zebernst.dev,vanilla.jptr.zebernst.dev"
          mc-router.itzg.me/autoScaleUp: "true"
          mc-router.itzg.me/autoScaleDown: "false"
        ports:
          game:
            port: 25565
          metrics:
            port: 8080
          rcon:
            name: rcon
            port: 25578
            protocol: TCP
      rcon-web:
        controller: rcon-web
        ports:
          http:
            port: 4326
          websocket:
            port: 4327

    serviceMonitor:
      vanilla:
        serviceName: *app
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 30s
    route:
      rcon-web:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "{{ .Release.Name }}.jptr.zebernst.dev"
        parentRefs:
          - name: tailscale
            namespace: kube-system
            sectionName: https-canon
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /ws
            filters: &rconAuth
              - type: ExternalAuth
                externalAuth:
                  protocol: HTTP
                  backendRef:
                    name: tinyauth
                    namespace: auth
                    port: 3000
                  http:
                    path: "/api/auth/envoy?path="
                    allowedHeaders:
                      - cookie
                      - accept
                      - authorization
                      - x-forwarded-proto
                      - x-forwarded-host
                    allowedResponseHeaders:
                      - set-cookie
                      - content-type
            timeouts:
              request: 0s
            backendRefs:
              - identifier: rcon-web
                port: 4327
          - filters: *rconAuth
            timeouts:
              request: 0s
            backendRefs:
              - identifier: rcon-web
                port: 4326
    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          vanilla:
            vanilla:
              - path: /tmp
      data:
        existingClaim: *app
        advancedMounts:
          vanilla:
            vanilla:
              - path: /data
            bluemap:
              - path: /data
                readOnly: true
      bluemap-shared:
        existingClaim: bluemap-shared
        advancedMounts:
          vanilla:
            init-bluemap-config:
              - path: /app/web
            bluemap:
              - path: /app/web
              - path: /app/bluemap
                subPath: vanilla-state
      bluemap-cache:
        type: emptyDir
        advancedMounts:
          vanilla:
            bluemap:
              - path: /app/data
      bluemap-configs-source:
        type: configMap
        name: vanilla-bluemap-configs
        advancedMounts:
          vanilla:
            init-bluemap-config:
              - path: /configs-source
                readOnly: true
      bluemap-maps-source:
        type: configMap
        name: vanilla-bluemap-maps
        advancedMounts:
          vanilla:
            init-bluemap-config:
              - path: /maps-source
                readOnly: true
      bluemap-config:
        type: emptyDir
        advancedMounts:
          vanilla:
            init-bluemap-config:
              - path: /app/config
            bluemap:
              - path: /app/config
      rcon-web-db:
        type: emptyDir
        advancedMounts:
          rcon-web:
            rcon-web:
              - path: /opt/rcon-web-admin/db
