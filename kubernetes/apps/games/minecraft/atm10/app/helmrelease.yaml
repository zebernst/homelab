# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app atm10
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  # Let mc-router own StatefulSet replicas (scale subresource) without Helm
  # resetting them on every reconcile.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: atm10
            patch: |
              - op: remove
                path: /spec/replicas

  values:
    controllers:
      atm10:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-bluemap-config:
            image:
              repository: busybox
              tag: latest
            command: ["sh", "-c"]
            args:
              - |
                cp /configs-source/*.conf /app/config/
                mkdir -p /app/config/maps
                cp /maps-source/*.conf /app/config/maps/
        containers:
          atm10:
            image:
              repository: ghcr.io/itzg/minecraft-server
              tag: 2026.8.0-java21
            env:
              EULA: "true"
              TZ: America/Chicago
              TYPE: "AUTO_CURSEFORGE"
              CF_SLUG: "all-the-mods-10"
              ICON: https://media.forgecdn.net/avatars/thumbnails/1182/438/64/64/638755918649288941.png
              MOTD: |
                A %MODPACK_NAME% server running %MODPACK_VERSION%.
                §oHosted on §dJupiter§r
              SERVER_NAME: *app
              DIFFICULTY: normal
              ALLOW_FLIGHT: true
              ENFORCE_WHITELIST: "true"
              EXISTING_WHITELIST_FILE: SYNCHRONIZE
              WHITELIST: |
                zebernst
                Snorlocke
                Travler34__
              OPS: |
                zebernst
              INIT_MEMORY: 2G
              MAX_MEMORY: &max-memory 14G
              MAX_TICK_TIME: "-1"
              RCON_PORT: "25578"
            envFrom:
              - secretRef:
                  name: atm10-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  periodSeconds: 60
                  exec: &probeexec { command: [ "mc-health" ] }
              readiness: *probe
              startup:
                <<: *probe
                spec:
                  initialDelaySeconds: 30
                  periodSeconds: 1
                  failureThreshold: 300
                  exec: *probeexec
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 3
                memory: *max-memory
          mc-monitor:
            image:
              repository: itzg/mc-monitor
              tag: 0.17.0@sha256:0d6b89c29d93cfcfcfee7bfd8e3758ddf00e20eb157e3e9a6560a93fe7fe84d1
            args: ["export-for-prometheus"]
            env:
              EXPORT_SERVERS: atm10
              DEBUG: "false"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
          bluemap:
            image:
              repository: ghcr.io/bluemap-minecraft/bluemap
              tag: v5.23
            args: ["-r", "-u", "-w", "-n", "/data/mods"]
            env:
              JAVA_TOOL_OPTIONS: "-Xmx3G"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 4Gi

      rcon-web:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          rcon-web:
            image:
              repository: docker.io/itzg/rcon
              tag: latest@sha256:66cc978f196e2fb4c0afccc7bf7102773445cff85ea41eefe58dca19ea78413c
            env:
              RWA_USERNAME: admin
              RWA_ADMIN: "TRUE"
              RWA_GAME: minecraft
              RWA_SERVER_NAME: *app
              RWA_RCON_HOST: "{{ .Release.Name }}-rcon"
              RWA_RCON_PORT: "25578"
              RWA_WEBSOCKET_URL_SSL: "wss://{{ .Release.Name }}.jptr.zebernst.dev/ws"
              RWA_WEBSOCKET_URL: "wss://{{ .Release.Name }}.jptr.zebernst.dev/ws"
            envFrom:
              - secretRef:
                  name: atm10-secret
            probes:
              liveness: &rconProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 4326
              readiness: *rconProbe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch

    service:
      atm10:
        annotations:
          mc-router.itzg.me/externalServerName: "atm10.zebernst.dev"
          mc-router.itzg.me/autoScaleUp: "true"
          mc-router.itzg.me/autoScaleDown: "true"
          mc-router.itzg.me/autoScaleAsleepMOTD: "§eATM10 is sleeping.§r Join once to wake it, then reconnect in a few minutes."
          mc-router.itzg.me/autoScaleLoadingMOTD: "§eATM10 is starting…§r Modpack boot takes a few minutes — reconnect shortly."
          # Match startup probe window: initialDelaySeconds(30) + periodSeconds(1)*failureThreshold(300)
          mc-router.itzg.me/autoScaleWaitTimeout: "5m30s"
        ports:
          game:
            port: 25565
          metrics:
            port: 8080
      rcon:
        controller: *app
        ports:
          rcon:
            port: 25578
      rcon-web:
        controller: rcon-web
        ports:
          http:
            port: 4326
          websocket:
            port: 4327

    serviceMonitor:
      atm10:
        serviceName: *app
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 30s
    route:
      rcon-web:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "{{ .Release.Name }}.jptr.zebernst.dev"
        parentRefs:
          - name: tailscale
            namespace: kube-system
            sectionName: https-canon
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /ws
            filters: &rconAuth
              - type: ExternalAuth
                externalAuth:
                  protocol: HTTP
                  backendRef:
                    name: tinyauth
                    namespace: auth
                    port: 3000
                  http:
                    path: "/api/auth/envoy?path="
                    allowedHeaders:
                      - cookie
                      - accept
                      - authorization
                      - x-forwarded-proto
                      - x-forwarded-host
                    allowedResponseHeaders:
                      - set-cookie
                      - content-type
            timeouts:
              request: 0s
            backendRefs:
              - identifier: rcon-web
                port: 4327
          - filters: *rconAuth
            timeouts:
              request: 0s
            backendRefs:
              - identifier: rcon-web
                port: 4326
    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          atm10:
            atm10:
              - path: /tmp
      data:
        existingClaim: *app
        advancedMounts:
          atm10:
            atm10:
              - path: /data
            bluemap:
              - path: /data
                readOnly: true
      bluemap-shared:
        existingClaim: bluemap-shared
        advancedMounts:
          atm10:
            init-bluemap-config:
              - path: /app/web
            bluemap:
              - path: /app/web
              - path: /app/bluemap
                subPath: atm10-state
      bluemap-cache:
        type: emptyDir
        advancedMounts:
          atm10:
            bluemap:
              - path: /app/data
      bluemap-configs-source:
        type: configMap
        name: atm10-bluemap-configs
        advancedMounts:
          atm10:
            init-bluemap-config:
              - path: /configs-source
                readOnly: true
      bluemap-maps-source:
        type: configMap
        name: atm10-bluemap-maps
        advancedMounts:
          atm10:
            init-bluemap-config:
              - path: /maps-source
                readOnly: true
      bluemap-config:
        type: emptyDir
        advancedMounts:
          atm10:
            init-bluemap-config:
              - path: /app/config
            bluemap:
              - path: /app/config
      rcon-web-db:
        type: emptyDir
        advancedMounts:
          rcon-web:
            rcon-web:
              - path: /opt/rcon-web-admin/db
