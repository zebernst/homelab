# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
---
# Holmes server + operator: cluster-internal only, no internet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: holmesgpt
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - holmes
          - holmes-operator
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API server
    - toEntities:
        - kube-apiserver
    # Ollama LLM backend
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: ollama
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
    # VictoriaMetrics
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmsingle
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
    # Alertmanager
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmalertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
    # Victoria Logs
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: victoria-logs-single
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
    # GitHub MCP server (in-namespace, chart-managed port 8000)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: github-mcp-server
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
# GitHub MCP: egress locked to api.github.com; ingress only from holmes.
# Chart NetworkPolicy is disabled — owned here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: holmesgpt-github-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: github-mcp-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: holmes
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Required whenever this endpoint has ingress enforcement: DNS replies
    # arrive sourced as the kube-dns ClusterIP identity (KPR, no pod socket-LB)
    # and miss conntrack after DNS-proxy interception, so they hit ingress.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
  egress:
    # Canonical toFQDNs companion: proxy/inspect DNS via kube-dns
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: "api.github.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
