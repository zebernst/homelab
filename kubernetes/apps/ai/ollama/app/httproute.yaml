# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama-lan
  annotations:
    # *.internal listener serves a private-CA cert gatus can't verify
    gatus.home-operations.com/endpoint: |
      name: ollama
      group: ai
      client:
        dns-resolver: tcp://kube-dns.kube-system.svc:53
        insecure: true
spec:
  hostnames:
    - ollama.internal
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https-internal
  rules:
    - backendRefs:
        - name: ollama
          port: 11434
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama-tailscale
  annotations:
    gatus.home-operations.com/endpoint: |
      name: ollama-ts
      group: ai
spec:
  hostnames:
    - ollama.zebernst.dev
  parentRefs:
    - name: tailscale
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
        - name: ollama
          port: 11434
