# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  annotations:
    # *.internal listener serves a private-CA cert gatus can't verify
    gatus.home-operations.com/endpoint: |
      name: open-webui
      group: ai
      client:
        dns-resolver: tcp://kube-dns.kube-system.svc:53
        insecure: true
spec:
  hostnames:
    - open-webui.internal
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https-internal
  rules:
    - backendRefs:
        - name: open-webui
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui-canon
spec:
  hostnames:
    - open-webui.jptr.zebernst.dev
  parentRefs:
    - name: tailscale
      namespace: kube-system
      sectionName: https-canon
  rules:
    - backendRefs:
        - name: open-webui
          port: 80
