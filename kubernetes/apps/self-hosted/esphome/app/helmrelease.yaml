# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app esphome
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  values:
    controllers:
      esphome:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          esphome:
            image:
              repository: ghcr.io/home-operations/esphome
              tag: 2026.7.4@sha256:9d786e254aeb71b38a8448ad2c8605d5163a20089efcb7e80d3df6770ddcb2d1
            env:
              TZ: America/Chicago
              ESPHOME_TRUSTED_DOMAINS: esphome.jptr.zebernst.dev
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /version
                    port: &port 6052
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /version
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 8Gi
    defaultPodOptions:
      priorityClassName: internal-only
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    service:
      esphome:
        controller: *app
        ports:
          http:
            port: *port
          peer:
            port: &peerPort 6055
    route:
      canonical:
        annotations:
          gatus.home-operations.com/endpoint: |
            name: "{{ .Release.Name }}"
            group: "{{ .Release.Namespace }}"
        hostnames:
          - "{{ .Release.Name }}.jptr.zebernst.dev"
        parentRefs:
          - name: tailscale
            namespace: kube-system
            sectionName: https-canon
        rules:
          - backendRefs:
              - name: *app
                port: *port
      peer:
        kind: TCPRoute
        annotations:
          external-dns.alpha.kubernetes.io/hostname: esphome.internal
        parentRefs:
          - name: esphome
            namespace: "{{ .Release.Namespace }}"
            kind: ListenerSet
            sectionName: peer
        rules:
          - backendRefs:
              - name: *app
                port: *peerPort
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      cache:
        type: persistentVolumeClaim
        forceRename: esphome-cache
        size: 20Gi
        accessMode: ReadWriteOnce
        storageClass: ceph-block
        globalMounts:
          - path: /cache
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
