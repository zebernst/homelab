# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app esphome
  namespace: &ns self-hosted
spec:
  targetNamespace: *ns
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: kubernetes/apps/self-hosted/esphome/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  postBuild:
    substitute:
      APP: *app
      # Must match the already-bound claim (Helm previously provisioned 20Gi);
      # PVC size cannot shrink, and 1Gi was failing Flux dry-run.
      VOLSYNC_CAPACITY: 20Gi
  patches:
    # Claim was created by Helm without dataSourceRef. Leaving dataSourceRef in
    # the desired VolSync PVC makes every reconcile fail (immutable field).
    - target:
        kind: PersistentVolumeClaim
        name: esphome
      patch: |-
        - op: remove
          path: /spec/dataSourceRef
    # Keep annotation so Helm can drop ownership when cache stops creating the PVC.
    - target:
        kind: PersistentVolumeClaim
        name: esphome
      patch: |-
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: esphome
          annotations:
            helm.sh/resource-policy: keep
