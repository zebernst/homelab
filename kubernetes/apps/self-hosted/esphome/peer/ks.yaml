# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app esphome-peer
  namespace: &ns self-hosted
spec:
  targetNamespace: *ns
  commonMetadata:
    labels:
      app.kubernetes.io/name: esphome
  dependsOn:
    - name: esphome
      namespace: *ns
    - name: cilium-gateway
      namespace: kube-system
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: kubernetes/apps/self-hosted/esphome/peer
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
