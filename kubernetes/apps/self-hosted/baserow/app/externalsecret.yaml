---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: baserow
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: baserow-secret
    template:
      engineVersion: v2
      data:
        DATABASE_HOST: redspot-rw.database.svc.cluster.local
        DATABASE_PORT: "5432"
        DATABASE_NAME: baserow
        DATABASE_USER: "{{ .BASEROW_POSTGRES_USER }}"
        DATABASE_PASSWORD: "{{ .BASEROW_POSTGRES_PASS }}"
        SECRET_KEY: "{{ .BASEROW_SECRET_KEY }}"
        BASEROW_JWT_SIGNING_KEY: "{{ .BASEROW_JWT_SIGNING_KEY }}"

        INIT_POSTGRES_DBNAME: baserow
        INIT_POSTGRES_HOST: redspot-rw.database.svc.cluster.local
        INIT_POSTGRES_PORT: "5432"
        INIT_POSTGRES_USER: "{{ .BASEROW_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .BASEROW_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract: {key: baserow}
    - extract: {key: cloudnative-pg}
