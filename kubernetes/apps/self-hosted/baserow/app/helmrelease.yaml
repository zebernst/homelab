# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app baserow
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  values:
    controllers:
      baserow:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 17
            envFrom: &envFrom
              - secretRef:
                  name: baserow-secret
        containers:
          baserow:
            image:
              repository: docker.io/baserow/baserow
              tag: 2.4.1@sha256:2229bc0ad9c8e1c3c44cef3324ff0501639d44a7b6f64026ebaa44f61cfb038e
            env:
              BASEROW_PUBLIC_URL: "https://{{ .Release.Name }}.jptr.zebernst.dev"
              BASEROW_EXTRA_PUBLIC_URLS: "http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc"
              BASEROW_CADDY_ADDRESSES: ":80"
              BASEROW_RUN_MINIMAL: "yes"
              BASEROW_AMOUNT_OF_WORKERS: "1"
              REDIS_URL: redis://localhost:6379
              EMAIL_SMTP: "true"
              EMAIL_SMTP_HOST: smtp-relay.network.svc.cluster.local
              EMAIL_SMTP_PORT: "25"
              FROM_EMAIL: noreply@zebernst.dev
            envFrom: *envFrom
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/_health/
                    port: &port 80
                    httpHeaders:
                      - name: Host
                        value: "{{ .Release.Name }}.{{ .Release.Namespace }}.svc"
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/_health/
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: "{{ .Release.Name }}.{{ .Release.Namespace }}.svc"
                  failureThreshold: 60
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 1Gi
              limits:
                memory: 4Gi
          valkey:
            image:
              repository: ghcr.io/valkey-io/valkey
              tag: 9.1.3-alpine
            command: ["valkey-server", "--save", "", "--loglevel", "warning"]
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      priorityClassName: internal-only
    service:
      baserow:
        controller: *app
        ports:
          http:
            port: *port
    route:
      canonical:
        annotations:
          gatus.home-operations.com/endpoint: |
            name: "{{ .Release.Name }}"
            group: "{{ .Release.Namespace }}"
        hostnames:
          - "{{ .Release.Name }}.jptr.zebernst.dev"
        parentRefs:
          - name: tailscale
            namespace: kube-system
            sectionName: https-canon
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          baserow:
            baserow:
              - path: /baserow/data
