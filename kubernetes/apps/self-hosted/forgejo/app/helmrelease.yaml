# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: forgejo

  values:
    image:
      rootless: true

    replicaCount: 1
    strategy:
      type: Recreate

    priorityClassName: external-facing

    podSecurityContext:
      fsGroup: 1000

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
        add: ["SYS_CHROOT"]
      privileged: false
      readOnlyRootFilesystem: true
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000

    service:
      http:
        type: ClusterIP
        port: 3000
      ssh:
        type: ClusterIP
        port: 22

    ingress:
      enabled: false

    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |
          name: forgejo
          group: self-hosted
          path: /api/healthz
      parentRefs:
        - name: external
          namespace: kube-system
          sectionName: https
      hostnames:
        - git.zebernst.dev
      port: 3000
      terminate: true

    persistence:
      enabled: true
      create: false
      mount: true
      claimName: *app

    deployment:
      annotations:
        reloader.stakater.com/auto: "true"
      env:
        - name: FORGEJO__STORAGE__STORAGE_TYPE
          value: minio
        - name: FORGEJO__STORAGE__MINIO_ENDPOINT
          value: rook-ceph-rgw-ceph-objectstore.rook-ceph.svc.cluster.local
        - name: FORGEJO__STORAGE__MINIO_LOCATION
          value: us-east-1
        - name: FORGEJO__STORAGE__MINIO_USE_SSL
          value: "false"
        - name: FORGEJO__STORAGE__MINIO_INSECURE_SKIP_VERIFY
          value: "true"
        - name: FORGEJO__STORAGE__MINIO_BUCKET_LOOKUP
          value: path
        - name: FORGEJO__STORAGE__MINIO_BUCKET
          valueFrom:
            configMapKeyRef:
              name: forgejo-bucket
              key: BUCKET_NAME
        - name: FORGEJO__STORAGE__MINIO_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: forgejo-bucket
              key: AWS_ACCESS_KEY_ID
        - name: FORGEJO__STORAGE__MINIO_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: forgejo-bucket
              key: AWS_SECRET_ACCESS_KEY

    gitea:
      admin:
        username: ""

      metrics:
        enabled: true
        serviceMonitor:
          enabled: false

      oauth:
        - name: pocket-id
          provider: openidConnect
          existingSecret: forgejo-oauth-secret
          autoDiscoverUrl: https://id.zebernst.dev/.well-known/openid-configuration
          scopes: openid email profile groups

      additionalConfigSources:
        - secret:
            secretName: forgejo-secret

      config:
        APP_NAME: "Forgejo"
        RUN_MODE: prod

        server:
          DOMAIN: git.zebernst.dev
          ROOT_URL: https://git.zebernst.dev/
          SSH_DOMAIN: git.internal
          SSH_PORT: 22
          START_SSH_SERVER: "true"
          DISABLE_SSH: "false"
          OFFLINE_MODE: "false"

        service:
          DISABLE_REGISTRATION: "true"
          ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
          SHOW_REGISTRATION_BUTTON: "false"
          ENABLE_INTERNAL_SIGNIN: "false"
          REQUIRE_SIGNIN_VIEW: "false"
          DEFAULT_KEEP_EMAIL_PRIVATE: "true"
          DEFAULT_ALLOW_CREATE_ORGANIZATION: "false"

        admin:
          DISABLE_REGULAR_ORG_CREATION: "true"

        openid:
          ENABLE_OPENID_SIGNIN: "false"
          ENABLE_OPENID_SIGNUP: "false"

        oauth2_client:
          ENABLE_AUTO_REGISTRATION: "true"
          ACCOUNT_LINKING: auto
          UPDATE_AVATAR: "true"
          USERNAME: nickname

        packages:
          ENABLED: "true"
          LIMIT_SIZE_CONTAINER: 2048

        actions:
          ENABLED: "true"
          DEFAULT_ACTIONS_URL: https://data.forgejo.org

        repository:
          DEFAULT_BRANCH: main
          DISABLE_HTTP_GIT: "false"
          MAX_CREATION_LIMIT: 0
          ALLOW_FORK_WITHOUT_MAXIMUM_LIMIT: "false"

        mailer:
          ENABLED: "true"
          PROTOCOL: smtp
          SMTP_ADDR: smtp-relay.network.svc.cluster.local
          SMTP_PORT: 25
          FROM: forgejo@zebernst.dev

        security:
          INSTALL_LOCK: "true"
          PASSWORD_COMPLEXITY: "off"
          MIN_PASSWORD_LENGTH: 12

        # Personal forge: in-process cache + memory sessions + LevelDB queues (PVC).
        # Redis/Dragonfly only recommended for high-activity instances.
        # https://forgejo.org/docs/latest/admin/setup/recommendations/
        cache:
          ADAPTER: twoqueue
          HOST: '{"size":100, "recent_ratio":0.25, "ghost_ratio":0.5}'
        session:
          PROVIDER: memory
        queue:
          TYPE: level

    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 2Gi
