---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/operator.victoriametrics.com/vmalertmanagerconfig_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    group_by: ["alertname", "cluster", "namespace", "job"]
    group_interval: 10m
    group_wait: 1m
    receiver: pushover
    repeat_interval: 12h
    routes:
      - receiver: blackhole
        matchers:
          - alertname="InfoInhibitor"
      - receiver: blackhole
        matchers:
          - severity="info"
      - receiver: heartbeat
        group_interval: 5m
        group_wait: 0s
        repeat_interval: 1m
        matchers:
          - alertname="Watchdog"
  inhibit_rules:
    # Same alert: critical suppresses warning
    - equal: ["alertname", "namespace"]
      source_matchers:
        - severity="critical"
      target_matchers:
        - severity="warning"

    # Scrape latch: TargetDown is the actionable signal; vmagent meta is noise
    - equal: ["namespace"]
      source_matchers:
        - alertname="TargetDown"
      target_matchers:
        - alertname="TooManyScrapeErrors"
    - equal: ["namespace"]
      source_matchers:
        - alertname="TargetDown"
      target_matchers:
        - alertname="TooManyLogs"
    # Scrape latch without TargetDown (e.g. <10% of a job's targets failing)
    - equal: ["namespace", "instance"]
      source_matchers:
        - alertname="TooManyScrapeErrors"
      target_matchers:
        - alertname="TooManyLogs"

    # Kube: crash loop is the cause; NotReady is the symptom on the same pod
    - equal: ["namespace", "pod"]
      source_matchers:
        - alertname="KubePodCrashLooping"
      target_matchers:
        - alertname="KubePodNotReady"

    # Flux: instance-level failure subsumes per-object reconcile noise
    - equal: ["namespace"]
      source_matchers:
        - alertname="FluxInstanceNotReady"
      target_matchers:
        - alertname=~"HelmReleaseReconciliationFailure|KustomizationReconciliationFailure"

    # Ceph: hard health error subsumes soft health warning
    - source_matchers:
        - alertname="CephHealthError"
      target_matchers:
        - alertname="CephHealthWarning"
  receivers:
    - name: blackhole
    - name: heartbeat
      webhook_configs:
        - url_secret:
            name: alertmanager-secret
            key: BUDDY_HEARTBEAT_URL
          http_config:
            bearer_token_secret:
              name: alertmanager-secret
              key: BUDDY_HEARTBEAT_TOKEN
    - name: pushover
      pushover_configs:
        - html: true
          message: |-
            {{- range .Alerts }}
              {{- if ne .Annotations.description "" }}
                {{ .Annotations.description }}
              {{- else if ne .Annotations.summary "" }}
                {{ .Annotations.summary }}
              {{- else if ne .Annotations.message "" }}
                {{ .Annotations.message }}
              {{- else }}
                Alert description not available
              {{- end }}
              {{- if ne .Annotations.runbook_url "" }}
                <p><a href="{{ .Annotations.runbook_url }}">Runbook</a></p>
              {{- end }}
              {{- if gt (len .Labels.SortedPairs) 0 }}
                <small>
                  {{- range .Labels.SortedPairs }}
                    <b>{{ .Name }}:</b> {{ .Value }}
                  {{- end }}
                </small>
              {{- end }}
            {{- end }}
          priority: |-
            {{- if eq .Status "firing" -}}
              {{- if eq .CommonLabels.severity "critical" -}}1
              {{- else if eq .CommonLabels.severity "warning" -}}-1
              {{- else -}}0
              {{- end -}}
            {{- else -}}
              {{- if eq .CommonLabels.severity "critical" -}}0
              {{- else -}}-2
              {{- end -}}
            {{- end -}}
          send_resolved: true
          sound: gamelan
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
            {{ .CommonLabels.alertname }}
          token:
            name: alertmanager-secret
            key: ALERTMANAGER_PUSHOVER_TOKEN
          user_key:
            name: alertmanager-secret
            key: PUSHOVER_USER_KEY
          url_title: View in Alertmanager
