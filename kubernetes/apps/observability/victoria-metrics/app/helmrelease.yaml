# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-metrics-k8s-stack
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.90.2
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  dependsOn:
    - name: prometheus-operator-crds
      namespace: observability
    - name: victoria-metrics-operator
      namespace: observability
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  interval: 30m

  values:
    nameOverride: vmks
    fullnameOverride: vmks
    tenant: "0"

    victoria-metrics-operator:
      enabled: false

    external:
      grafana:
        host: https://grafana.jptr.zebernst.dev
        datasource: Prometheus

    defaultDatasources:
      victoriametrics:
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            isDefault: true
            access: proxy

    defaultDashboards:
      enabled: true
      sources:
        victoriametrics-operator:
          enabled: true

    defaultRules:
      enabled: true
      alerting:
        spec:
          keep_firing_for: 90s
          labels:
            # vmalert/VMRule webhook only allows $labels/$value/$expr — not Helm's `default`
            job: '{{ if $labels.namespace }}{{ $labels.namespace }}{{ else }}cluster{{ end }}'

    extraRules:
      dockerhub-rules:
        groups:
          - name: dockerhub
            labels:
              job: cadvisor
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: >-
                    There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                for: 5m
                keep_firing_for: 90s
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            labels:
              job: '{{ if $labels.namespace }}{{ $labels.namespace }}{{ else }}cluster{{ end }}'
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                for: 5m
                keep_firing_for: 90s
                labels:
                  severity: critical

    grafana:
      enabled: false

    alertmanager:
      enabled: true
      useManagedConfig: true
      spec:
        # Required when merging chart vmks + standalone VMAlertmanagerConfig; otherwise
        # the operator forces continue: true on first-level routes and alerts fan out
        # to multiple receivers (e.g. blackhole + pushover).
        disableRouteContinueEnforce: true
        externalURL: https://alertmanager.jptr.zebernst.dev
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
      ingress:
        enabled: false

    vmagent:
      enabled: true
      spec:
        selectAllByDefault: true
        scrapeInterval: 30s
        priorityClassName: control-plane-critical
        externalLabels:
          cluster: jupiter
        # Enforce sample-wins for taxonomy identity labels. The operator only
        # exposes overrideHonorLabels→false (target wins / exported_*), so restore
        # conflicting exporter labels before remote write. No-op when the sample
        # never emitted the label.
        inlineRelabelConfig:
          - sourceLabels: [exported_namespace]
            regex: (.+)
            replacement: $1
            targetLabel: namespace
          - sourceLabels: [exported_pod]
            regex: (.+)
            replacement: $1
            targetLabel: pod
          - sourceLabels: [exported_container]
            regex: (.+)
            replacement: $1
            targetLabel: container
          - sourceLabels: [exported_app]
            regex: (.+)
            replacement: $1
            targetLabel: app
          - sourceLabels: [exported_app_instance]
            regex: (.+)
            replacement: $1
            targetLabel: app_instance
          - sourceLabels: [exported_component]
            regex: (.+)
            replacement: $1
            targetLabel: component
          - sourceLabels: [exported_part_of]
            regex: (.+)
            replacement: $1
            targetLabel: part_of
          - sourceLabels: [exported_helmrelease]
            regex: (.+)
            replacement: $1
            targetLabel: helmrelease
          - sourceLabels: [exported_flux_kustomization]
            regex: (.+)
            replacement: $1
            targetLabel: flux_kustomization
          - action: labeldrop
            regex: exported_(namespace|pod|container|app|app_instance|component|part_of|helmrelease|flux_kustomization)
        globalScrapeRelabelConfigs:
          - action: replace
            sourceLabels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_label_observability_homelab_zebernst_dev_canonical_labels
              - __meta_kubernetes_namespace
            regex: (.+);(|true);(.+)
            replacement: $3
            targetLabel: namespace
          # Service app labels are ordered from lowest to highest precedence.
          - action: replace
            sourceLabels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_label_observability_homelab_zebernst_dev_canonical_labels
              - __meta_kubernetes_service_label_k8s_app
            regex: (.+);(|true);(.+)
            replacement: $3
            targetLabel: app
          - action: replace
            sourceLabels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_label_observability_homelab_zebernst_dev_canonical_labels
              - __meta_kubernetes_service_label_app
            regex: (.+);(|true);(.+)
            replacement: $3
            targetLabel: app
          - action: replace
            sourceLabels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_label_observability_homelab_zebernst_dev_canonical_labels
              - __meta_kubernetes_service_label_app_kubernetes_io_name
            regex: (.+);(|true);(.+)
            replacement: $3
            targetLabel: app
          - action: replace
            sourceLabels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_label_observability_homelab_zebernst_dev_canonical_labels
              - __meta_kubernetes_service_label_app_kubernetes_io_instance
            regex: (.+);(|true);(.+)
            replacement: $3
            targetLabel: app_instance
          - action: replace
            sourceLabels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_label_observability_homelab_zebernst_dev_canonical_labels
              - __meta_kubernetes_service_label_app_kubernetes_io_component
            regex: (.+);(|true);(.+)
            replacement: $3
            targetLabel: component
          - action: replace
            sourceLabels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_label_observability_homelab_zebernst_dev_canonical_labels
              - __meta_kubernetes_service_label_app_kubernetes_io_part_of
            regex: (.+);(|true);(.+)
            replacement: $3
            targetLabel: part_of
          - action: replace
            sourceLabels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_label_observability_homelab_zebernst_dev_canonical_labels
              - __meta_kubernetes_service_label_helm_toolkit_fluxcd_io_name
            regex: (.+);(|true);(.+)
            replacement: $3
            targetLabel: helmrelease
          - action: replace
            sourceLabels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_label_observability_homelab_zebernst_dev_canonical_labels
              - __meta_kubernetes_service_label_kustomize_toolkit_fluxcd_io_name
            regex: (.+);(|true);(.+)
            replacement: $3
            targetLabel: flux_kustomization
          - action: replace
            sourceLabels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_label_observability_homelab_zebernst_dev_canonical_labels
              - __meta_kubernetes_pod_name
            regex: (.+);(|true);(.+)
            replacement: $3
            targetLabel: pod
          - action: replace
            sourceLabels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_label_observability_homelab_zebernst_dev_canonical_labels
              - __meta_kubernetes_pod_container_name
            regex: (.+);(|true);(.+)
            replacement: $3
            targetLabel: container
          # Pod app labels run after Service labels so Pod metadata wins.
          - action: replace
            sourceLabels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_label_observability_homelab_zebernst_dev_canonical_labels
              - __meta_kubernetes_pod_label_k8s_app
            regex: (.+);(|true);(.+)
            replacement: $3
            targetLabel: app
          - action: replace
            sourceLabels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_label_observability_homelab_zebernst_dev_canonical_labels
              - __meta_kubernetes_pod_label_app
            regex: (.+);(|true);(.+)
            replacement: $3
            targetLabel: app
          - action: replace
            sourceLabels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_label_observability_homelab_zebernst_dev_canonical_labels
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            regex: (.+);(|true);(.+)
            replacement: $3
            targetLabel: app
          - action: replace
            sourceLabels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_label_observability_homelab_zebernst_dev_canonical_labels
              - __meta_kubernetes_pod_label_app_kubernetes_io_instance
            regex: (.+);(|true);(.+)
            replacement: $3
            targetLabel: app_instance
          - action: replace
            sourceLabels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_label_observability_homelab_zebernst_dev_canonical_labels
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
            regex: (.+);(|true);(.+)
            replacement: $3
            targetLabel: component
          - action: replace
            sourceLabels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_label_observability_homelab_zebernst_dev_canonical_labels
              - __meta_kubernetes_pod_label_app_kubernetes_io_part_of
            regex: (.+);(|true);(.+)
            replacement: $3
            targetLabel: part_of
        extraArgs:
          promscrape.dropOriginalLabels: "true"
          promscrape.maxScrapeSize: 50MiB
          promscrape.streamParse: "true"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

    kubelet:
      vmScrape:
        spec:
          metricRelabelConfigs:
            - action: labeldrop
              regex: (uid)
            - action: labeldrop
              regex: (id|name)
            - action: drop
              source_labels: [__name__]
              regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
            # labelmap copies every node label onto kubelet/cadvisor metrics; GPU
            # nodes with Talos extensions + NFD + NVIDIA labels exceed the 40-label
            # vmsingle limit and spam RowsRejectedOnIngestion / TooManyLogs.
            - action: labeldrop
              regex: (extensions_talos_dev_.+|feature_node_kubernetes_io_.+|nvidia_com_gpu_.+|plan_upgrade_cattle_io_.+|beta_kubernetes_io_.+)

    vmsingle:
      enabled: true
      spec:
        retentionPeriod: "90d"
        replicaCount: 1
        priorityClassName: control-plane-critical
        extraArgs:
          search.maxQueryDuration: 120s
          memory.allowedPercent: "80"
        resources:
          requests:
            cpu: 100m
            memory: 6Gi
          limits:
            memory: 6Gi
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: ceph-block
          resources:
            requests:
              storage: 50Gi
      ingress:
        enabled: false

    vmalert:
      enabled: true
      spec:
        selectAllByDefault: true
        evaluationInterval: 30s
        externalLabels:
          cluster: jupiter
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi

    prometheus-node-exporter:
      fullnameOverride: node-exporter
      service:
        labels:
          observability.homelab.zebernst.dev/canonical-labels: "false"
      vmScrape:
        enabled: true
        spec:
          jobLabel: jobLabel
          endpoints:
            - port: metrics
              relabelConfigs:
                - action: replace
                  regex: (.*)
                  replacement: $1
                  sourceLabels: ["__meta_kubernetes_pod_node_name"]
                  targetLabel: kubernetes_node

    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      customLabels:
        observability.homelab.zebernst.dev/canonical-labels: "false"
      # Explicit allowlist (not [*]). Still drops high-cardinality controller noise:
      # pod-template-hash, controller-revision-hash, controller-uid, job/batch UIDs,
      # apps.kubernetes.io/pod-index, statefulset.kubernetes.io/pod-name,
      # functionUid / environmentUid, topology-location-host, etc.
      metricLabelsAllowlist:
        # taxonomy + chart/pkg + Flux + CNPG/Rook/Tailscale/Fission/Cilium one-offs
        - pods=[app.kubernetes.io/name,app.kubernetes.io/instance,app.kubernetes.io/component,app.kubernetes.io/part-of,app.kubernetes.io/managed-by,app.kubernetes.io/version,app.kubernetes.io/created-by,app.kubernetes.io/controller,app,k8s-app,helm.sh/chart,chart,release,helm.toolkit.fluxcd.io/name,helm.toolkit.fluxcd.io/namespace,kustomize.toolkit.fluxcd.io/name,kustomize.toolkit.fluxcd.io/namespace,fluxcd.controlplane.io/name,fluxcd.controlplane.io/namespace,cnpg.io/cluster,cnpg.io/instanceName,cnpg.io/instanceRole,cnpg.io/podRole,rook_cluster,rook-version,ceph_daemon_type,ceph-version,rook.io/operator-namespace,rook_file_system,rook_object_store,device-class,failure-domain,role,component,name,tier,svc,application,control-plane,version,io.cilium/app,tailscale.com/managed,tailscale.com/parent-resource,tailscale.com/parent-resource-ns,tailscale.com/parent-resource-type,functionName,functionNamespace,executorType,environmentName,environmentNamespace,fission.io/served,application.giantswarm.io/team,openebs.io/component-name,kubernetes.io/name,kubernetes.io/cluster-service]
        - deployments=[app.kubernetes.io/name,app.kubernetes.io/instance,app.kubernetes.io/component,app.kubernetes.io/part-of,app.kubernetes.io/managed-by,app.kubernetes.io/version,app.kubernetes.io/created-by,app.kubernetes.io/controller,app,k8s-app,helm.sh/chart,chart,release,helm.toolkit.fluxcd.io/name,helm.toolkit.fluxcd.io/namespace,kustomize.toolkit.fluxcd.io/name,kustomize.toolkit.fluxcd.io/namespace,fluxcd.controlplane.io/name,fluxcd.controlplane.io/namespace,rook_cluster,rook-version,ceph_daemon_type,ceph-version,rook.io/operator-namespace,rook_file_system,rook_object_store,device-class,failure-domain,role,component,name,tier,svc,application,control-plane,version,io.cilium/app,application.giantswarm.io/team,openebs.io/component-name,kubernetes.io/name,kubernetes.io/cluster-service]
        - persistentvolumeclaims=[app.kubernetes.io/name,app.kubernetes.io/instance,app.kubernetes.io/component,app.kubernetes.io/part-of,app.kubernetes.io/managed-by,app.kubernetes.io/version,app.kubernetes.io/created-by,app,helm.sh/chart,chart,release,managed-by,helm.toolkit.fluxcd.io/name,helm.toolkit.fluxcd.io/namespace,kustomize.toolkit.fluxcd.io/name,kustomize.toolkit.fluxcd.io/namespace,cnpg.io/cluster,cnpg.io/instanceName,cnpg.io/instanceRole,cnpg.io/pvcRole,volsync.backube/cleanup,role,alertmanager,prometheus,operator.prometheus.io/name,operator.prometheus.io/shard]
      # Gateway API State Metrics (Kuadrant CRS) — feeds Grafana dashboards 19432–19573
      # https://github.com/Kuadrant/gateway-api-state-metrics
      customResourceState:
        enabled: true
        create: false
        name: kube-state-metrics-gateway-api
        key: config.yaml
      rbac:
        extraRules:
          - apiGroups: ["gateway.networking.k8s.io"]
            resources:
              - gateways
              - gatewayclasses
              - httproutes
              - grpcroutes
              - tcproutes
              - tlsroutes
              - udproutes
              - backendtlspolicies
            verbs: ["list", "watch"]
      vmScrape:
        enabled: true
        spec:
          endpoints:
            - port: http
              honorLabels: true
              relabelConfigs:
                - action: replace
                  regex: (.*)
                  replacement: $1
                  sourceLabels: ["__meta_kubernetes_pod_node_name"]
                  targetLabel: kubernetes_node

    kubeProxy:
      enabled: false
      service:
        enabled: false

    kubeApiServer:
      vmScrape:
        spec:
          selector:
            matchLabels:
              component: apiserver
              provider: kubernetes

    kubeScheduler:
      service:
        selector:
          k8s-app: kube-scheduler
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    kubeControllerManager:
      service:
        selector:
          k8s-app: kube-controller-manager
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    kubeEtcd:
      service:
        selector:
          component: kube-apiserver
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - scheme: http
