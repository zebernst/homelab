---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/operator.victoriametrics.com/vmprobe_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: devices
spec:
  interval: 1m
  module: icmp
  vmProberSpec:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    static:
      labels:
        namespace: observability
      # ups.internal is covered by snmp-exporter (TargetDown / UPSOnBattery);
      # ICMP here duplicated host-down paging whenever the UPS was unreachable.
      targets:
        - unifi
        - nas.internal
        - homeassistant.internal
