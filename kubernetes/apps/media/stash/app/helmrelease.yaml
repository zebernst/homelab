# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app stash
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  values:
    controllers:
      stash:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          stash:
            image:
              repository: ghcr.io/feederbox826/stash-s6
              tag: hwaccel@sha256:7df6c8f657239ae36d2d0ef627428e7e1e3d9ea33244d8aa8bb2cd365f9f5375
              pullPolicy: IfNotPresent
            env:
              TZ: America/Chicago
              PUID: 568
              # stash-s6 installs /config/requirements.txt into /pip-install on every start.
              # Do not set INSTALL_PY_DEPS — that only apk/apts build toolchains and needs root.
              STASH_CONFIG_FILE: /config/config.yml
              STASH_STASH: /media/xxx/
              STASH_GENERATED: /generated/
              STASH_METADATA: /metadata/
              STASH_CACHE: /cache/
              STASH_PORT: &port 9999
              STASH_EXTERNAL_HOST: https://stash.jptr.zebernst.dev

            probes:
              liveness: &probe
                enabled: true
              readiness: *probe
              startup: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 12Gi
                gpu.intel.com/i915: 1
          chrome:
            image:
              repository: chromedp/headless-shell
              tag: 152.0.7939.3
            args:
              - --enable-unsafe-swiftshader
            probes:
              liveness: &probe
                enabled: true
              readiness: *probe
              startup: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi

    defaultPodOptions:
      priorityClassName: background
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [65568]
    service:
      stash:
        controller: *app
        ports:
          http:
            port: *port
    route:
      canonical:
        annotations:
          gatus.home-operations.com/endpoint: |
            name: "{{ .Release.Name }}"
            group: "{{ .Release.Namespace }}"
        hostnames:
          - "{{ .Release.Name }}.jptr.zebernst.dev"
        parentRefs:
          - name: tailscale
            namespace: kube-system
            sectionName: https-canon
    persistence:
      config:
        existingClaim: stash
        globalMounts:
          - path: /config
            subPath: config
          - path: /blobs
            subPath: blobs
      python-requirements:
        type: configMap
        name: stash-python-requirements
        globalMounts:
          - path: /config/requirements.txt
            subPath: requirements.txt
            readOnly: true
      shalookup-config:
        type: secret
        name: stash-secret
        globalMounts:
          - path: /config/scrapers/SHALookup/config.py
            subPath: config.py
            readOnly: true
      cache:
        existingClaim: stash-cache
        globalMounts:
          - path: /cache
            subPath: cache
          - path: /generated
            subPath: generated
          - path: /metadata
            subPath: metadata
          - path: /pip-install
            subPath: pip
      media:
        type: nfs
        server: nas.internal
        path: /volume1/media
        globalMounts:
          - path: /media
      tmp:
        type: emptyDir
