# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app coredns-canonical
spec:
  interval: 30m
  chart:
    spec:
      chart: k8s-gateway
      version: 3.4.1
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: flux-system

  values:
    fullnameOverride: coredns-canonical
    domain: jptr.zebernst.dev
    watchedResources:
      - HTTPRoute
      - Service
    filters:
      gatewayClasses:
        - cilium-ts
    replicaCount: 2
    priorityClassName: network-critical
    service:
      type: LoadBalancer
      loadBalancerClass: tailscale
      useTcp: true
      annotations:
        tailscale.com/hostname: jupiter-dns
