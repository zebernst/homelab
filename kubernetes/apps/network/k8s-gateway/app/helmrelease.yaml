# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app k8s-gateway
spec:
  interval: 30m
  chart:
    spec:
      chart: k8s-gateway
      version: 3.4.1
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: flux-system

  values:
    fullnameOverride: coredns-gateway
    domain: jptr.zebernst.dev
    watchedResources:
      - HTTPRoute
      - Service
    filters:
      gatewayClasses:
        - cilium-ts
    replicaCount: 2
    priorityClassName: network-critical
    service:
      # L4 front door: # jupiter-dns Gateway (TCPRoute/UDPRoute on :53). MagicDNS
      # hostname jupiter-dns lives on the Gateway so split DNS is unchanged.
      type: ClusterIP
      useTcp: true
