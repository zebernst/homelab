---
# L4 front door for jptr DNS over the tailnet. MagicDNS hostname jupiter-dns
# is what Tailscale split DNS already points at — keep it stable across the
# LoadBalancer → Gateway cutover.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: jupiter-dns
spec:
  gatewayClassName: cilium-ts
  infrastructure:
    annotations:
      tailscale.com/hostname: jupiter-dns
  listeners:
    - name: dns-tcp
      protocol: TCP
      port: 53
      allowedRoutes:
        namespaces:
          from: Same
    - name: dns-udp
      protocol: UDP
      port: 53
      allowedRoutes:
        namespaces:
          from: Same
