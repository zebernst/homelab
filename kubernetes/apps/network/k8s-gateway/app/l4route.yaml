---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/tcproute_v1alpha2.json
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: coredns-gateway
spec:
  parentRefs:
    - name: jupiter-dns
      sectionName: dns-tcp
  rules:
    - backendRefs:
        - name: coredns-gateway
          port: 53
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/udproute_v1alpha2.json
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: UDPRoute
metadata:
  name: coredns-gateway
spec:
  parentRefs:
    - name: jupiter-dns
      sectionName: dns-udp
  rules:
    - backendRefs:
        - name: coredns-gateway
          port: 53
