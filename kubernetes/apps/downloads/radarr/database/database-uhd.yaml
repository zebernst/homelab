# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/database_v1.json
---
# Second database owned by the ${APP} role created by the cnpg-database
# component. The component cannot express one role owning two databases, so
# the extra database is declared here and both radarr KSs depend on radarr-db.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: radarr-uhd
spec:
  name: radarr-uhd
  owner: ${APP}
  cluster:
    name: ${CNPG_CLUSTER:=redspot}
  ensure: present
  databaseReclaimPolicy: ${CNPG_RECLAIM:=retain}
