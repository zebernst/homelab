---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: modem-pdu-cycle
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: modem-pdu-cycle-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        webhook.token: "{{ .MODEM_PDU_CYCLE_WEBHOOK_TOKEN }}"
        unifi.url: '{{ .UNIFI_URL | default "https://unifi" }}'
        unifi.username: "{{ .UNIFI_USERNAME }}"
        unifi.password: "{{ .UNIFI_PASSWORD }}"
        unifi.site: '{{ .UNIFI_SITE | default "default" }}'
        pdu.mac: "{{ .PDU_MAC }}"
        pdu.outlet_index: "{{ .PDU_OUTLET_INDEX }}"
        pdu.off_seconds: '{{ .PDU_OFF_SECONDS | default "5" }}'
  dataFrom:
    - extract:
        key: modem-pdu-cycle
