[project]
name = "modem-pdu-cycle"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "fastapi",
    "pytest",
    "pytest-asyncio",
]

# Constrains dev deps to match the versions bundled in the fission python-fastapi-env image.
# Source: https://github.com/fission/environments/blob/master/python-fastapi/requirements.txt
[tool.uv]
constraint-dependencies = [
    "fastapi==0.114.0",
    "uvicorn==0.30.6",
]
