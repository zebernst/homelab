---
apiVersion: v1
kind: Service
metadata:
  name: redspot-lb
  annotations:
    external-dns.alpha.kubernetes.io/hostname: redspot.internal
    lbipam.cilium.io/ips: 192.168.20.3, ::ffff:c0a8:1403
spec:
  type: LoadBalancer
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    cnpg.io/cluster: redspot
    cnpg.io/instanceRole: primary
