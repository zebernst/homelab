# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/networking.k8s.io/networkpolicy_v1.json
---
# The operator-managed "hindwing" NetworkPolicy (networkPolicyEnabled: true) only
# allows :6379 from pods in the database namespace, cutting off cross-namespace
# clients (nocodb, paperless). NetworkPolicies are additive, so this restores
# open ingress on :6379 while the operator policy keeps admin :9999 restricted
# to the operator and peer pods — plus vmagent, which scrapes Dragonfly metrics
# on the admin port (see cluster/vmpodscrape.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hindwing-redis-ingress
spec:
  podSelector:
    matchLabels:
      app: hindwing
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 6379
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: 9999
          protocol: TCP
