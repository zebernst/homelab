---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lan
  annotations:
    external-dns.alpha.kubernetes.io/target: &hostname gw-lan.zebernst.dev
    gatus.home-operations.com/endpoint: |
      client:
        dns-resolver: tcp://kube-dns.kube-system.svc:53
      conditions:
        - "[STATUS] == 200"
  labels:
    external-dns.alpha.kubernetes.io/registry: unifi
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.20.21
    - type: IPAddress
      value: ::ffff:192.168.20.21
  infrastructure:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: *hostname
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.zebernst.dev"
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.zebernst.dev"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: zebernst-dev-tls
            namespace: cert-manager
    - name: esphome-peer
      protocol: TCP
      port: 6055
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TCPRoute
