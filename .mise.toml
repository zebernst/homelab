[env]
KUBECONFIG = "{{config_root}}/kubernetes/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"

[plugins]
# Loads secrets from fnox.toml into the environment (used under tofu/)
"fnox-env" = "https://github.com/jdx/mise-env-fnox"

[tools]
1password-cli = "latest"
age = "latest"
"aqua:cert-manager/cmctl" = "latest"
"aqua:cloudnative-pg/cloudnative-pg/kubectl-cnpg" = "latest"
"aqua:dolthub/dolt" = "latest"
"aqua:elsesiy/kubectl-view-secret" = "latest"
"aqua:kvaps/kubectl-node-shell" = "latest"
cilium-cli = "latest"
cloudflared = "latest"
fission = "latest"
flux2 = "latest"
fnox = "latest"
gh = "latest"
hk = "latest"
"github:stacktower-io/stacktower" = "latest"
"github:steveyegge/beads" = "latest"
helm = "latest"
helm-diff = "latest"
helmfile = "latest"
jq = "latest"
k9s = "latest"
kubecolor = "latest"
kubectl = "latest"
kustomize = "latest"
"github:home-operations/flate" = "latest"
opentofu = "latest"
talhelper = "latest"
talosctl = "latest"
task = "latest"
"ubi:clbx/kubectl-browse-pvc" = "latest"
"ubi:mitsuhiko/minijinja" = { version = "latest", exe = "minijinja-cli" }
"ubi:rook/kubectl-rook-ceph" = "latest"
yq = "latest"
